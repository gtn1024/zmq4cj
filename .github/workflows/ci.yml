name: ci

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get submodule hash
        id: submodule-hash
        run: echo "hash=$(git -C vendor/libzmq rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: vendor/build
          key: libzmq-${{ runner.os }}-${{ hashFiles('build.cj') }}-${{ steps.submodule-hash.outputs.hash }}
      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Zxilly/setup-cangjie@v2
        with:
          channel: sts
          version: 1.1.0
      - name: Verify enum constants match zmq.h
        shell: bash
        run: |
          errors=0
          grep 'case [A-Z_]* => [0-9]*' src/zmq_types.cj | sed 's/.*case //;s/ => /=/' | while IFS='=' read -r name value; do
            if [ "$name" = "IDENTITY" ]; then continue; fi
            expected=$(grep "define ZMQ_${name} " vendor/libzmq/include/zmq.h | head -1 | awk '{print $3}')
            if [ -z "$expected" ]; then echo "SKIP ${name}"; continue; fi
            if [ "$value" != "$expected" ]; then
              echo "ERROR: ${name} expected ${expected}, got ${value}"
              exit 1
            else
              echo "OK ${name}=${value}"
            fi
          done
      - name: build
        shell: bash
        run: cjpm build
      - name: test
        shell: bash
        run: cjpm test
