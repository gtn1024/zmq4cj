name: ci

on: [push, pull_request]

env:
  # zig version used to build libzmq for Windows (zig produces a libc++ ABI that
  # matches Cangjie's llvm-mingw runtime). Validated with 0.16.0.
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get submodule hash
        id: submodule-hash
        run: echo "hash=$(git -C vendor/libzmq rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: vendor/build
          key: libzmq-${{ runner.os }}-${{ hashFiles('build.cj') }}-${{ steps.submodule-hash.outputs.hash }}
      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Zxilly/setup-cangjie@v2
        with:
          channel: sts
          version: 1.1.0
      - name: Verify enum constants match zmq.h
        shell: bash
        run: |
          errors=0
          grep 'case [A-Z_]* => [0-9]*' src/zmq_types.cj | sed 's/.*case //;s/ => /=/' | while IFS='=' read -r name value; do
            if [ "$name" = "IDENTITY" ]; then continue; fi
            expected=$(grep "define ZMQ_${name} " vendor/libzmq/include/zmq.h | head -1 | awk '{print $3}')
            if [ -z "$expected" ]; then echo "SKIP ${name}"; continue; fi
            if [ "$value" != "$expected" ]; then
              echo "ERROR: ${name} expected ${expected}, got ${value}"
              exit 1
            else
              echo "OK ${name}=${value}"
            fi
          done
      - name: build
        shell: bash
        run: cjpm build
      - name: dump build-script log (on failure)
        if: failure()
        shell: bash
        run: cat build-script-cache/release/zmq/bin/script-log 2>/dev/null | tail -60 || true
      - name: test
        shell: bash
        timeout-minutes: 8
        run: cjpm test --verbose

  # Native Windows build. zig builds libzmq with a libc++ ABI that matches
  # Cangjie's llvm-mingw runtime (system MinGW g++ would produce libstdc++ and
  # fail to link — the historical Windows CI failure). Tests run natively.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get submodule hash
        id: submodule-hash
        run: echo "hash=$(git -C vendor/libzmq rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: vendor/build/windows
          key: libzmq-windows-${{ hashFiles('build.cj') }}-${{ steps.submodule-hash.outputs.hash }}-zig${{ env.ZIG_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Zxilly/setup-cangjie@v2
        with:
          channel: sts
          version: 1.1.0
      - name: Verify enum constants match zmq.h
        shell: bash
        run: |
          grep 'case [A-Z_]* => [0-9]*' src/zmq_types.cj | sed 's/.*case //;s/ => /=/' | while IFS='=' read -r name value; do
            if [ "$name" = "IDENTITY" ]; then continue; fi
            expected=$(grep "define ZMQ_${name} " vendor/libzmq/include/zmq.h | head -1 | awk '{print $3}')
            if [ -z "$expected" ]; then echo "SKIP ${name}"; continue; fi
            if [ "$value" != "$expected" ]; then
              echo "ERROR: ${name} expected ${expected}, got ${value}"
              exit 1
            fi
          done
      - name: build
        shell: bash
        run: cjpm build
      - name: dump build-script log (on failure)
        if: failure()
        shell: bash
        run: cat build-script-cache/release/zmq/bin/script-log 2>/dev/null | tail -60 || true
      - name: test
        shell: bash
        timeout-minutes: 8
        run: cjpm test --verbose
